<%
  def env_or_default(name, default)
    value = ENV[name]
    value.nil? || value.empty? ? default : value
  end

  def truthy_env?(name, default = false)
    value = ENV.fetch(name, default.to_s).to_s.downcase
    %w[1 true yes on].include?(value)
  end

  def yaml_string(value)
    value.to_s.inspect
  end

  def docker_resource_name(value)
    normalized = value.to_s.downcase.gsub(/[^a-z0-9]+/, '_').gsub(/\A_+|_+\z/, '')
    normalized.empty? ? 'app' : normalized
  end

  service_name = env_or_default('KAMAL_SERVICE', 'platform')
  aws_region = env_or_default('AWS_REGION', env_or_default('AWS_DEFAULT_REGION', 'us-east-2'))
  ecr_registry = env_or_default('AWS_ECR_REGISTRY', nil)

  if ecr_registry.nil?
    aws_account_id = ENV.fetch('AWS_ACCOUNT_ID')
    ecr_registry = "#{aws_account_id}.dkr.ecr.#{aws_region}.amazonaws.com"
  end

  ecr_repository = env_or_default('AWS_ECR_REPOSITORY', 'insight-lpr/platform')
  web_host_list = env_or_default('KAMAL_SERVERS', nil)
  web_host_list = ENV.fetch('KAMAL_SERVER') if web_host_list.nil?
  web_hosts = web_host_list.split(',').map(&:strip).reject(&:empty?)
  proxy_host = env_or_default('KAMAL_PROXY_HOST', web_hosts.first)
  proxy_ssl = truthy_env?('KAMAL_PROXY_SSL')
  app_scheme = proxy_ssl ? 'https' : 'http'
  storage_volume = env_or_default('KAMAL_STORAGE_VOLUME', "#{docker_resource_name(service_name)}_storage")

  # Per-PR preview (kamal-pr-preview.yml). Shares the QA Postgres + ClickHouse
  # that pre-platform uses, runs NO migrations, and isolates only an ephemeral
  # per-PR Redis. Runs Horizon with --environment=preview (so `{otto}` is
  # provisioned) but NOT the scheduler / database queue worker (those would
  # double-act on the shared QA data).
  preview = truthy_env?('KAMAL_PREVIEW')

  # Platform forces https globally (AppServiceProvider::boot -> URL::forceScheme('https')),
  # so APP_URL/asset URLs are https even when kamal-proxy speaks plain HTTP behind a
  # TLS-terminating ALB. Default APP_URL to https regardless of the proxy scheme.
  app_url = env_or_default('APP_URL', "https://#{proxy_host}")
%>

service: <%= yaml_string(service_name) %>

image: <%= yaml_string(ecr_repository) %>

servers:
  web:
    hosts:
<% web_hosts.each do |host| %>
      - <%= yaml_string(host) %>
<% end %>
  # Horizon (Redis queues) — self-contained job processing on the same host.
  # Previews select the dedicated `preview` profile (config/horizon.php) so
  # `{otto}` is provisioned even though APP_ENV stays `preprod` for HTTPS.
  # no-healthcheck: these roles aren't web servers, so the image's inherited
  # (FrankenPHP base) /up healthcheck would never pass — Kamal waits for the
  # container to be running instead.
  workers:
    hosts:
<% web_hosts.each do |host| %>
      - <%= yaml_string(host) %>
<% end %>
    cmd: php artisan horizon<%= preview ? ' --environment=preview' : '' %>
    options:
      no-healthcheck: true
<% unless preview %>
  # Scheduler + database queue worker run only in NON-preview environments. A
  # preview shares pre-platform's QA database, so running the scheduler
  # (dispatches scheduled jobs against shared data) or the database queue worker
  # (drains the shared `jobs` table) would double-process pre-platform's work.
  # Scheduler — runs `schedule:run` every minute in the foreground.
  cron:
    hosts:
<% web_hosts.each do |host| %>
      - <%= yaml_string(host) %>
<% end %>
    cmd: php artisan schedule:work
    options:
      no-healthcheck: true
  # Database-connection queue worker (jobs dispatched onConnection('database')).
  dbworker:
    hosts:
<% web_hosts.each do |host| %>
      - <%= yaml_string(host) %>
<% end %>
    cmd: php artisan queue:work database --sleep=3 --tries=3 --max-time=3600
    options:
      no-healthcheck: true
<% end %>

accessories:
  # Platform's redis config (config/database.php) is cluster-only: connection
  # `default` lives under `clusters` with options.cluster=redis, and the queue
  # name uses the `{default}` hash tag. So this single node runs in cluster mode;
  # the deploy workflow assigns all 16384 slots to it after boot (see
  # kamal-deploy.yml / kamal-pr-preview.yml) so cluster_state becomes ok.
  redis:
    image: redis:7.4-alpine
    host: <%= yaml_string(web_hosts.first) %>
<% if preview %>
    # Per-PR preview Redis (cache + session + queue/Horizon). Still cluster-enabled
    # — platform's redis connection is cluster-only — but EPHEMERAL: no appendonly
    # persistence and no host-mounted data directory. A preview's queued jobs are
    # disposable, and this keeps teardown clean (`kamal accessory remove` leaves no
    # root-owned data volume behind). All 16384 slots are re-assigned on each deploy.
    cmd: redis-server --save "" --appendonly no --cluster-enabled yes --cluster-config-file /data/nodes.conf --cluster-node-timeout 5000
<% else %>
    cmd: redis-server --appendonly yes --cluster-enabled yes --cluster-config-file /data/nodes.conf --cluster-node-timeout 5000
    directories:
      - data:/data
<% end %>

proxy:
  host: <%= yaml_string(proxy_host) %>
  ssl: <%= proxy_ssl %>
  app_port: 80
  healthcheck:
    path: /up
    interval: 3
    timeout: 3

registry:
  server: <%= yaml_string(ecr_registry) %>
  username: AWS
  password:
    - KAMAL_REGISTRY_PASSWORD

builder:
  arch: amd64
  context: .
  dockerfile: Dockerfile
  secrets:
    - composer_auth
  args:
    VITE_GOOGLE_MAPS_API_KEY: <%= yaml_string(env_or_default('VITE_GOOGLE_MAPS_API_KEY', env_or_default('GOOGLE_MAPS_API_KEY', ''))) %>
    VITE_APP_NAME: <%= yaml_string(env_or_default('VITE_APP_NAME', env_or_default('APP_NAME', 'Platform'))) %>
    VITE_APP_URL: <%= yaml_string(env_or_default('VITE_APP_URL', app_url)) %>
    VITE_PUSHER_APP_KEY: <%= yaml_string(env_or_default('VITE_PUSHER_APP_KEY', env_or_default('PUSHER_APP_KEY', ''))) %>
    VITE_PUSHER_APP_CLUSTER: <%= yaml_string(env_or_default('VITE_PUSHER_APP_CLUSTER', env_or_default('PUSHER_APP_CLUSTER', 'mt1'))) %>
    VITE_PUSHER_HOST: <%= yaml_string(env_or_default('VITE_PUSHER_HOST', 'wss.insightlpr.io')) %>
    VITE_PUSHER_PORT: <%= yaml_string(env_or_default('VITE_PUSHER_PORT', env_or_default('PUSHER_PORT', '443'))) %>
    VITE_PUSHER_SCHEME: <%= yaml_string(env_or_default('VITE_PUSHER_SCHEME', env_or_default('PUSHER_SCHEME', 'https'))) %>

env:
  clear:
    APP_NAME: <%= yaml_string(env_or_default('APP_NAME', 'Platform')) %>
    APP_ENV: <%= yaml_string(env_or_default('APP_ENV', 'production')) %>
    KAMAL_PREVIEW: <%= yaml_string(preview ? 'true' : 'false') %>
    APP_DEBUG: <%= yaml_string(env_or_default('APP_DEBUG', 'false')) %>
    APP_TIMEZONE: <%= yaml_string(env_or_default('APP_TIMEZONE', 'UTC')) %>
    APP_URL: <%= yaml_string(app_url) %>
    FORCE_HTTPS: <%= yaml_string(env_or_default('FORCE_HTTPS', 'true')) %>
    PHP_RUNTIME_FRANKENPHP: "true"
    DEV_LOGIN_ENABLED: <%= yaml_string(env_or_default('DEV_LOGIN_ENABLED', 'false')) %>
    CLARITY_SCOUT_ENABLED: <%= yaml_string(env_or_default('CLARITY_SCOUT_ENABLED', 'false')) %>
    LOG_CHANNEL: <%= yaml_string(env_or_default('LOG_CHANNEL', 'stack')) %>
    LOG_STACK: <%= yaml_string(env_or_default('LOG_STACK', 'single')) %>
    LOG_DEPRECATIONS_CHANNEL: <%= yaml_string(env_or_default('LOG_DEPRECATIONS_CHANNEL', 'null')) %>
    LOG_LEVEL: <%= yaml_string(env_or_default('LOG_LEVEL', 'info')) %>
    BROADCAST_CONNECTION: <%= yaml_string(env_or_default('BROADCAST_CONNECTION', 'log')) %>
    PUSHER_HOST: <%= yaml_string(env_or_default('PUSHER_HOST', 'wss.insightlpr.io')) %>
    PUSHER_PORT: <%= yaml_string(env_or_default('PUSHER_PORT', '443')) %>
    PUSHER_SCHEME: <%= yaml_string(env_or_default('PUSHER_SCHEME', 'https')) %>
    PUSHER_APP_CLUSTER: <%= yaml_string(env_or_default('PUSHER_APP_CLUSTER', 'mt1')) %>
    VITE_PUSHER_APP_KEY: <%= yaml_string(env_or_default('VITE_PUSHER_APP_KEY', env_or_default('PUSHER_APP_KEY', ''))) %>
    VITE_PUSHER_APP_CLUSTER: <%= yaml_string(env_or_default('VITE_PUSHER_APP_CLUSTER', env_or_default('PUSHER_APP_CLUSTER', 'mt1'))) %>
    VITE_PUSHER_HOST: <%= yaml_string(env_or_default('VITE_PUSHER_HOST', 'wss.insightlpr.io')) %>
    VITE_PUSHER_PORT: <%= yaml_string(env_or_default('VITE_PUSHER_PORT', env_or_default('PUSHER_PORT', '443'))) %>
    VITE_PUSHER_SCHEME: <%= yaml_string(env_or_default('VITE_PUSHER_SCHEME', env_or_default('PUSHER_SCHEME', 'https'))) %>
    CACHE_STORE: <%= yaml_string(env_or_default('CACHE_STORE', 'redis')) %>
    FILESYSTEM_DISK: <%= yaml_string(env_or_default('FILESYSTEM_DISK', 's3')) %>
    QUEUE_CONNECTION: <%= yaml_string(env_or_default('QUEUE_CONNECTION', 'redis')) %>
    SESSION_DRIVER: <%= yaml_string(env_or_default('SESSION_DRIVER', 'redis')) %>
    SESSION_COOKIE: <%= yaml_string(env_or_default('SESSION_COOKIE', "#{docker_resource_name(service_name)}_session")) %>
    SESSION_SECURE_COOKIE: <%= yaml_string(env_or_default('SESSION_SECURE_COOKIE', 'true')) %>
    SESSION_LIFETIME: <%= yaml_string(env_or_default('SESSION_LIFETIME', '120')) %>
    SESSION_DOMAIN: <%= yaml_string(env_or_default('SESSION_DOMAIN', proxy_host)) %>
    SANCTUM_STATEFUL_DOMAINS: <%= yaml_string(env_or_default('SANCTUM_STATEFUL_DOMAINS', proxy_host)) %>
    DB_CONNECTION: <%= yaml_string(env_or_default('DB_CONNECTION', 'platform')) %>
    DB_HOST: <%= yaml_string(env_or_default('DB_HOST', '127.0.0.1')) %>
    DB_READ_HOST: <%= yaml_string(env_or_default('DB_READ_HOST', env_or_default('DB_HOST', '127.0.0.1'))) %>
    DB_PORT: <%= yaml_string(env_or_default('DB_PORT', '5432')) %>
    DB_DATABASE: <%= yaml_string(env_or_default('DB_DATABASE', 'zod')) %>
    DB_SEARCH_PATH: <%= yaml_string(env_or_default('DB_SEARCH_PATH', 'platform')) %>
    REDIS_CLIENT: <%= yaml_string(env_or_default('REDIS_CLIENT', 'phpredis')) %>
    REDIS_CLUSTER: <%= yaml_string(env_or_default('REDIS_CLUSTER', 'redis')) %>
    REDIS_HOST_1: <%= yaml_string(env_or_default('REDIS_HOST_1', '127.0.0.1')) %>
    REDIS_HOST_2: <%= yaml_string(env_or_default('REDIS_HOST_2', env_or_default('REDIS_HOST_1', '127.0.0.1'))) %>
    REDIS_PORT: <%= yaml_string(env_or_default('REDIS_PORT', '6379')) %>
    REDIS_DB: <%= yaml_string(env_or_default('REDIS_DB', '0')) %>
    REDIS_PREFIX: <%= yaml_string(env_or_default('REDIS_PREFIX', "#{docker_resource_name(service_name)}_")) %>
    HORIZON_PREFIX: <%= yaml_string(env_or_default('HORIZON_PREFIX', "#{docker_resource_name(service_name)}_horizon:")) %>
    MAIL_MAILER: <%= yaml_string(env_or_default('MAIL_MAILER', 'log')) %>
    MAIL_HOST: <%= yaml_string(env_or_default('MAIL_HOST', '')) %>
    MAIL_PORT: <%= yaml_string(env_or_default('MAIL_PORT', '587')) %>
    MAIL_ENCRYPTION: <%= yaml_string(env_or_default('MAIL_ENCRYPTION', 'tls')) %>
    MAIL_FROM_ADDRESS: <%= yaml_string(env_or_default('MAIL_FROM_ADDRESS', 'noreply@insightlpr.com')) %>
    MAIL_FROM_NAME: <%= yaml_string(env_or_default('MAIL_FROM_NAME', 'Platform')) %>
    AWS_DEFAULT_REGION: <%= yaml_string(env_or_default('AWS_DEFAULT_REGION', aws_region)) %>
    AWS_USE_PATH_STYLE_ENDPOINT: <%= yaml_string(env_or_default('AWS_USE_PATH_STYLE_ENDPOINT', 'false')) %>
    TRACK_ANALYTICS: <%= yaml_string(env_or_default('TRACK_ANALYTICS', 'false')) %>
    CLICKHOUSE_DRIVER: <%= yaml_string(env_or_default('CLICKHOUSE_DRIVER', 'clickhouse')) %>
    CLICKHOUSE_HOST: <%= yaml_string(env_or_default('CLICKHOUSE_HOST', '')) %>
    CLICKHOUSE_PORT: <%= yaml_string(env_or_default('CLICKHOUSE_PORT', '8123')) %>
    CLICKHOUSE_HTTPS: <%= yaml_string(env_or_default('CLICKHOUSE_HTTPS', 'true')) %>
    CLICKHOUSE_DATABASE_CLARITY: <%= yaml_string(env_or_default('CLICKHOUSE_DATABASE_CLARITY', 'clarity')) %>
    CLICKHOUSE_DATABASE_ZOD: <%= yaml_string(env_or_default('CLICKHOUSE_DATABASE_ZOD', 'zod')) %>
    CLICKHOUSE_TIMEOUT_CONNECT: <%= yaml_string(env_or_default('CLICKHOUSE_TIMEOUT_CONNECT', '2')) %>
    CLICKHOUSE_TIMEOUT_QUERY: <%= yaml_string(env_or_default('CLICKHOUSE_TIMEOUT_QUERY', '60')) %>
    GOOGLE_MAPS_API_KEY: <%= yaml_string(env_or_default('GOOGLE_MAPS_API_KEY', env_or_default('VITE_GOOGLE_MAPS_API_KEY', ''))) %>
    VITE_GOOGLE_MAPS_API_KEY: <%= yaml_string(env_or_default('VITE_GOOGLE_MAPS_API_KEY', env_or_default('GOOGLE_MAPS_API_KEY', ''))) %>
    TWILIO_NUMBER: <%= yaml_string(env_or_default('TWILIO_NUMBER', '')) %>
    RDN_METRICS_QUEUE_URL: <%= yaml_string(env_or_default('RDN_METRICS_QUEUE_URL', '')) %>
    RDN_METRICS_AWS_REGION: <%= yaml_string(env_or_default('RDN_METRICS_AWS_REGION', 'us-east-2')) %>
    AWS_BEDROCK_REGION: <%= yaml_string(env_or_default('AWS_BEDROCK_REGION', env_or_default('AWS_DEFAULT_REGION', 'us-east-2'))) %>
    AWS_BEDROCK_USE_DEFAULT_CREDENTIALS: <%= yaml_string(env_or_default('AWS_BEDROCK_USE_DEFAULT_CREDENTIALS', 'true')) %>
    OTTO_PROVIDER: <%= yaml_string(env_or_default('OTTO_PROVIDER', 'bedrock')) %>
    OTTO_MODEL: <%= yaml_string(env_or_default('OTTO_MODEL', 'us.xai.grok-4.6')) %>
    OTTO_TOOL_CALL_LIMIT: <%= yaml_string(env_or_default('OTTO_TOOL_CALL_LIMIT', '50')) %>
    OTTO_LOG_LEVEL: <%= yaml_string(env_or_default('OTTO_LOG_LEVEL', 'debug')) %>
    OTTO_PRICE_PROMPT_PER_M: <%= yaml_string(env_or_default('OTTO_PRICE_PROMPT_PER_M', '2.20')) %>
    OTTO_PRICE_COMPLETION_PER_M: <%= yaml_string(env_or_default('OTTO_PRICE_COMPLETION_PER_M', '6.60')) %>
    OTTO_PRICE_CACHE_READ_PER_M: <%= yaml_string(env_or_default('OTTO_PRICE_CACHE_READ_PER_M', '0.55')) %>
  secret:
    - APP_KEY
    - DB_USERNAME
    - DB_PASSWORD
    - REDIS_PASSWORD
    - MAIL_USERNAME
    - MAIL_PASSWORD
    - AWS_ACCESS_KEY_ID
    - AWS_SECRET_ACCESS_KEY
    - AWS_BUCKET
    - CLICKHOUSE_USERNAME
    - CLICKHOUSE_PASSWORD
    - CLICKHOUSE_WRITE_USERNAME
    - CLICKHOUSE_WRITE_PASSWORD
    - PUSHER_APP_ID
    - PUSHER_APP_KEY
    - PUSHER_APP_SECRET
    - GEOCODIO_API_KEY
    - CONVERTAPI_SECRET
    - TWILIO_SID
    - TWILIO_TOKEN
    - MATCHER_API_KEY
    - MCP_BEARER_TOKEN
    - BEDROCK_KEY
    - BEDROCK_SECRET
    - AWS_BEDROCK_ACCESS_KEY_ID
    - AWS_BEDROCK_SECRET_ACCESS_KEY

volumes:
  - <%= yaml_string("#{storage_volume}:/app/storage") %>

asset_path: /app/public/build

aliases:
  artisan: app exec --interactive --reuse "php artisan"
  logs: app logs --follow

<% unless env_or_default('KAMAL_SSH_USER', '').empty? %>
ssh:
  user: <%= yaml_string(env_or_default('KAMAL_SSH_USER', '')) %>
<% end %>
