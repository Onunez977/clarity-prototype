<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Human QA Guide</title>
<style>
  :root {
    --bg: #f6f7f9; --card: #ffffff; --text: #1a1d21; --muted: #5c6470;
    --border: #e2e6ea; --accent: #2563eb; --accent-text: #ffffff;
    --ok: #16a34a; --warn: #d97706; --bad: #dc2626;
    --callout-bg: #eff6ff; --callout-border: #bfdbfe;
    --pitfall-bg: #fffbeb; --pitfall-border: #fde68a;
    --done-bg: #f0fdf4;
  }
  @media (prefers-color-scheme: dark) {
    :root {
      --bg: #14171b; --card: #1e2329; --text: #e8eaed; --muted: #9aa3ad;
      --border: #313840; --accent: #3b82f6; --accent-text: #ffffff;
      --ok: #4ade80; --warn: #fbbf24; --bad: #f87171;
      --callout-bg: #1e2a3f; --callout-border: #2c4368;
      --pitfall-bg: #2e2715; --pitfall-border: #574a1d;
      --done-bg: #16241b;
    }
  }
  * { box-sizing: border-box; }
  body {
    margin: 0; padding: 24px; background: var(--bg); color: var(--text);
    font: 15px/1.55 -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
  }
  .wrap { max-width: 880px; margin: 0 auto; }
  a { color: var(--accent); }
  h1 { font-size: 22px; margin: 0 0 2px; }
  h2 { font-size: 17px; margin: 28px 0 10px; }
  .meta { color: var(--muted); font-size: 13px; margin-bottom: 14px; }
  .meta code { background: var(--card); border: 1px solid var(--border); border-radius: 4px; padding: 1px 5px; }
  .card { background: var(--card); border: 1px solid var(--border); border-radius: 10px; padding: 16px; }
  /* --- standardized auth panel (sticky so it's reachable while scrolling) --- */
  #auth {
    position: sticky; top: 0; z-index: 20;
    background: var(--card); border: 1px solid var(--border); border-radius: 10px;
    padding: 12px 16px; margin: 14px 0 6px; box-shadow: 0 2px 8px rgba(0,0,0,.06);
  }
  #auth .auth-head { display: flex; align-items: baseline; justify-content: space-between; flex-wrap: wrap; gap: 8px; }
  #auth h2 { margin: 0; font-size: 15px; }
  #auth-current { color: var(--muted); font-size: 13px; }
  #auth-current b { color: var(--text); }
  .login-row { display: flex; flex-wrap: wrap; gap: 8px; margin: 10px 0 0; }
  .btn {
    display: inline-block; padding: 9px 16px; border-radius: 8px; border: 1px solid var(--border);
    background: var(--card); color: var(--text); text-decoration: none; font-weight: 600; font-size: 14px;
  }
  .btn.primary { background: var(--accent); border-color: var(--accent); color: var(--accent-text); }
  .btn:hover { filter: brightness(1.06); }
  .btn.active { outline: 2px solid var(--accent); outline-offset: 1px; }
  .persona-note { color: var(--muted); font-size: 12px; display: block; font-weight: 400; margin-top: 1px; }
  .cred-chip { display: inline-flex; align-items: center; gap: 8px; }
  .copy-btn {
    font: 600 11px/1 inherit; text-transform: uppercase; letter-spacing: .04em;
    padding: 4px 8px; border-radius: 6px; border: 1px solid var(--border);
    background: var(--bg); color: var(--muted); cursor: pointer;
  }
  .copy-btn:hover { color: var(--text); }
  .auth-note { color: var(--muted); font-size: 12px; margin-top: 8px; }
  .progress-track { height: 6px; background: var(--border); border-radius: 999px; margin-top: 12px; overflow: hidden; }
  #progress-bar { height: 100%; width: 0; background: var(--ok); border-radius: 999px; transition: width .25s ease; }
  .auth-controls { display: flex; align-items: center; gap: 16px; margin-top: 8px; font-size: 13px; color: var(--muted); }
  #auth-progress b { color: var(--text); }
  .auth-controls label { display: inline-flex; align-items: center; gap: 6px; cursor: pointer; }
  .auth-controls input { accent-color: var(--accent); cursor: pointer; }
  .step-login {
    display: inline-block; margin: 2px 0 6px; padding: 4px 10px; border-radius: 7px;
    border: 1px solid var(--callout-border); background: var(--callout-bg);
    color: var(--accent); text-decoration: none; font-weight: 600; font-size: 12.5px; cursor: pointer;
  }
  .step-login:hover { filter: brightness(1.04); }
  table { width: 100%; border-collapse: collapse; font-size: 14px; }
  th, td { text-align: left; padding: 7px 10px; border-bottom: 1px solid var(--border); vertical-align: top; }
  th { color: var(--muted); font-weight: 600; font-size: 12px; text-transform: uppercase; letter-spacing: .04em; }
  tr:last-child td { border-bottom: 0; }
  .status-ok { color: var(--ok); } .status-warn { color: var(--warn); } .status-bad { color: var(--bad); }
  .remedy { color: var(--muted); font-size: 13px; }
  .section-title { display: flex; align-items: center; gap: 10px; margin: 28px 0 12px; }
  .section-title h2 { margin: 0; }
  .sec-dot { width: 9px; height: 9px; border-radius: 50%; background: var(--muted); flex: none; }
  .sec-dot.happy { background: var(--ok); }
  .sec-dot.edge { background: var(--warn); }
  .sec-dot.findings { background: var(--bad); }
  .section-count { color: var(--muted); font-size: 12.5px; font-weight: 600; margin-left: auto; }
  .step { display: flex; gap: 12px; padding: 13px 16px; border: 1px solid var(--border);
    border-radius: 10px; background: var(--card); margin-bottom: 9px; }
  .step.done { background: var(--done-bg); border-color: transparent; }
  .step.done .action { text-decoration: line-through; opacity: .7; }
  .hide-done .step.done { display: none; }
  .step input[type=checkbox] { width: 19px; height: 19px; margin-top: 1px; flex: none; accent-color: var(--accent); cursor: pointer; }
  .step-body { flex: 1; min-width: 0; }
  .step-num { color: var(--muted); font-size: 11px; font-weight: 700; letter-spacing: .05em; }
  .action { font-weight: 600; margin: 1px 0 6px; font-size: 15px; }
  .callout { border: 1px solid transparent; border-radius: 7px; padding: 6px 11px; font-size: 13.5px; margin: 5px 0; }
  .callout .clabel { font-size: 11px; font-weight: 700; text-transform: uppercase; letter-spacing: .04em; color: var(--muted); margin-right: 7px; }
  .lookfor  { background: var(--callout-bg); border-color: var(--callout-border); }
  .expected { background: var(--done-bg);    border-color: var(--ok); }
  .expected .clabel { color: var(--ok); }
  .pitfall  { background: var(--pitfall-bg); border-color: var(--pitfall-border); }
  .pitfall .clabel { color: var(--warn); }
  .step textarea, #general-notes {
    width: 100%; margin-top: 8px; padding: 7px 9px; border: 1px solid var(--border); border-radius: 7px;
    background: var(--bg); color: var(--text); font: 13px/1.5 inherit; resize: vertical; min-height: 30px;
  }
  #general-notes { min-height: 70px; }
  .deeplink { font-size: 13px; margin: 4px 0; }
  .findings .step { border-left: 4px solid var(--warn); }
  .findings .step.sev-red { border-left-color: var(--bad); }
  footer { margin: 30px 0 10px; }
  .footer-row { display: flex; flex-wrap: wrap; align-items: center; gap: 10px; margin-top: 12px; }
  #progress { font-weight: 700; }
  #stale-banner {
    display: none; background: var(--pitfall-bg); border: 1px solid var(--pitfall-border);
    border-radius: 10px; padding: 12px 16px; margin: 14px 0; font-size: 14px;
  }
  #stale-banner button { margin-left: 8px; }
  button.btn { cursor: pointer; }
  .empty-note { color: var(--muted); font-style: italic; }
  /* --- agent-qa visual evidence: per-step screenshots + walkthrough video --- */
  .step-shot { display: block; max-width: 100%; border: 1px solid var(--border); border-radius: 8px; margin-top: 8px; }
  .shot-cap { color: var(--muted); font-size: 12px; margin: 4px 0 0; }
  .qa-video { width: 100%; border: 1px solid var(--border); border-radius: 10px; margin-top: 8px; background: #000; }
  .video-note { color: var(--muted); font-size: 13px; margin-top: 8px; }
</style>
</head>
<body>
<div class="wrap">
  <header>
    <h1 id="title"></h1>
    <div class="meta" id="meta"></div>
  </header>

  <section id="auth" aria-label="Sign in">
    <div class="auth-head">
      <h2 id="auth-title">Sign in</h2>
      <div id="auth-current">Testing as: <b>—</b></div>
    </div>
    <div class="login-row" id="logins"></div>
    <div class="auth-note" id="auth-note"></div>
    <div class="progress-track"><div id="progress-bar"></div></div>
    <div class="auth-controls">
      <span id="auth-progress">0/0 verified</span>
      <label><input type="checkbox" id="hide-done"> Hide completed</label>
    </div>
  </section>

  <div id="stale-banner">
    This guide was regenerated and its steps changed since you last saved progress.
    <button class="btn" id="stale-keep">Keep my progress</button>
    <button class="btn" id="stale-reset">Start fresh</button>
  </div>

  <h2>Environment</h2>
  <div class="card"><table id="env-table"><thead>
    <tr><th></th><th>Check</th><th>Detail</th></tr></thead><tbody></tbody></table></div>

  <div id="resource-envelope"></div>

  <h2>Seeded data</h2>
  <div class="card"><table id="seeded-table"><thead>
    <tr><th>Record</th><th>What it is</th><th>Where to find it</th></tr></thead><tbody></tbody></table></div>

  <div id="walkthrough-video"></div>

  <div id="walkthrough"></div>

  <footer class="card">
    <div><span id="progress"></span></div>
    <label for="general-notes" style="display:block;margin-top:10px;font-weight:600;">Overall notes</label>
    <textarea id="general-notes" placeholder="Anything that doesn't fit a single step — overall impressions, UI nits, follow-ups…"></textarea>
    <div class="footer-row">
      <button class="btn primary" id="export-btn">Copy results as Markdown</button>
      <button class="btn" id="reset-btn">Reset checklist</button>
      <span id="export-confirm" class="empty-note"></span>
    </div>
  </footer>
</div>

": "Restore the entitlement/role afterwards.", "persona": {"label": "Administrator (Test Company · Pro Plus)", "loginUrl": "https://clarity-claude_dev_2469.test/__qa/login/1"}}]}, {"title": "Edge cases", "steps": [{"id": "hp-8", "action": "Compare against the card beside it, Unique Scans to Case Claims, which renders a percentage (37.5%).", "lookFor": "The two should read as visibly different kinds of number — a ratio and a percentage. This is the whole reason this card is a plain ratio; if they look interchangeable, say so.", "persona": {"label": "Administrator (Test Company · Pro Plus)", "loginUrl": "https://clarity-claude_dev_2469.test/__qa/login/1"}}, {"id": "hp-9", "action": "Check Unique Scans to Repo (row 2, col 2).", "expected": "Still reads 0 — it is a stub and DEV-2470 is blocked. Confirm it is untouched.", "persona": {"label": "Administrator (Test Company · Pro Plus)", "loginUrl": "https://clarity-claude_dev_2469.test/__qa/login/1"}}, {"id": "hp-10", "action": "Inspect the sparkline.", "expected": "13 bars, month labels ending at the current month.", "pitfall": "Labels are UTC-anchored on purpose even though you are on America/Chicago — if the last label looks \"off by one\" near a month boundary, that is intended behaviour, not a bug.", "persona": {"label": "Administrator (Test Company · Pro Plus)", "loginUrl": "https://clarity-claude_dev_2469.test/__qa/login/1"}}]}, {"title": "Not covered by agent QA — please do these by hand", "steps": [{"id": "hp-11", "action": "Expand the card. Agent QA never exercised the expansion interaction.", "lookFor": "Click it, confirm the detail view opens with the chart, and that opening a different card replaces it.", "persona": {"label": "Administrator (Test Company · Pro Plus)", "loginUrl": "https://clarity-claude_dev_2469.test/__qa/login/1"}}, {"id": "hp-12", "action": "Open devtools, reload, and check the browser console.", "lookFor": "Agent QA read the DOM after load rather than installing an error collector.", "expec <script>
(function () {
  'use strict';
  var data = JSON.parse(document.getElementById('qa-data').textContent);
  var KEY = data.storageKey || ('human-qa:' + (data.ticket && data.ticket.key || data.branch || 'unknown'));

  // ---- state ----------------------------------------------------------
  function loadState() {
    try { return JSON.parse(localStorage.getItem(KEY)) || null; } catch (e) { return null; }
  }
  function blankState() { return { checks: {}, notes: {}, generalNotes: '', currentPersona: null, hideDone: false, generatedAt: data.generatedAt }; }
  var state = loadState() || blankState();
  function save() {
    state.generatedAt = data.generatedAt;
    try { localStorage.setItem(KEY, JSON.stringify(state)); } catch (e) {}
  }

  // ---- collect all steps (walkthrough sections + agent-qa findings) ---
  var sections = (data.sections || []).slice();
  if (data.agentQaFindings && data.agentQaFindings.length) {
    sections.push({
      title: 'Agent QA flagged', findings: true,
      steps: data.agentQaFindings.map(function (f, i) {
        return { id: f.id || ('aqa-' + (i + 1)), action: 'Agent QA flagged: ' + f.text,
                 lookFor: f.verify || null, severity: f.severity || 'yellow',
                 clip: f.clip || null, screenshot: f.screenshot || null };
      })
    });
  }
  var allSteps = sections.reduce(function (acc, s) { return acc.concat(s.steps || []); }, []);

  // ---- staleness: saved state references step ids that no longer exist
  var saved = loadState();
  var currentIds = {};
  allSteps.forEach(function (s) { currentIds[s.id] = true; });
  var isStale = false;
  if (saved && saved.generatedAt && saved.generatedAt !== data.generatedAt) {
    var savedIds = Object.keys(saved.checks || {}).concat(Object.keys(saved.notes || {}));
    isStale = savedIds.some(function (id) { return !currentIds[id]; });
  }

  // ---- header ----------------------------------------------------------
  var t = data.ticket || {};
  document.title = 'Human QA — ' + (t.key || data.branch || '');
  var titleEl = document.getElementById('title');
  titleEl.textContent = (t.key ? t.key + ' — ' : '') + (t.summary || data.branch || 'QA Guide');
  var metaBits = [];
  if (data.branch) metaBits.push('branch <code>' + esc(data.branch) + '</code>');
  if (data.baseBranch) metaBits.push('base <code>' + esc(data.baseBranch) + '</code>');
  if (data.mode) metaBits.push('mode <code>' + esc(data.mode) + '</code>');
  if (data.generatedAt) metaBits.push('generated ' + esc(data.generatedAt));
  if (t.url) metaBits.push('<a href="' + esc(t.url) + '" target="_blank" rel="noopener">Jira ticket ↗</a>');
  document.getElementById('meta').innerHTML = metaBits.join(' · ');

  // ---- auth panel: one-click logins + switcher + "testing as" indicator ----
  var personas = data.personas || [];
  var logins = document.getElementById('logins');
  var authCurrentEl = document.getElementById('auth-current');
  var authNote = document.getElementById('auth-note');
  var loginEls = {};   // persona label -> panel button, for active-state highlighting

  document.getElementById('auth-title').textContent =
    personas.length > 1 ? 'Sign in & switch user' : 'Sign in';

  function setCurrentPersona(label) {
    state.currentPersona = label || null;
    save();
    renderCurrentPersona();
  }
  function renderCurrentPersona() {
    authCurrentEl.innerHTML = 'Testing as: <b>' + esc(state.currentPersona || '—') + '</b>';
    Object.keys(loginEls).forEach(function (l) {
      loginEls[l].classList.toggle('active', l === state.currentPersona);
    });
  }

  personas.forEach(function (p, i) {
    if (p.loginUrl) {
      // Dev-login: a one-click deep-link that also records who you're now testing as.
      var a = document.createElement('a');
      a.className = 'btn' + (i === 0 ? ' primary' : '');
      a.href = p.loginUrl; a.target = '_blank'; a.rel = 'noopener';
      a.innerHTML = esc(p.label) + (p.notes ? '<span class="persona-note">' + esc(p.notes) + '</span>' : '');
      a.addEventListener('click', function () { setCurrentPersona(p.label); });
      loginEls[p.label] = a;
      logins.appendChild(a);
    } else {
      // No dev-login: a credentials chip with a Copy button — the switching aid here.
      var chip = document.createElement('div');
      chip.className = 'btn cred-chip' + (i === 0 ? ' primary' : '');
      var span = document.createElement('span');
      var creds = p.credentials ? (' — ' + p.credentials) : '';
      span.innerHTML = esc(p.label) + (p.notes || p.credentials
        ? '<span class="persona-note">' + esc((p.notes || '') + creds) + '</span>' : '');
      chip.appendChild(span);
      if (p.credentials) {
        var copy = document.createElement('button');
        copy.type = 'button'; copy.className = 'copy-btn'; copy.textContent = 'Copy';
        copy.addEventListener('click', function (e) {
          e.stopPropagation(); copyText(p.credentials, copy); setCurrentPersona(p.label);
        });
        chip.appendChild(copy);
      }
      loginEls[p.label] = chip;
      logins.appendChild(chip);
    }
  });

  // Standardized note line: single-user, manual-login, or no-personas guidance.
  if (!personas.length) {
    authNote.textContent = 'No personas resolved — re-run qa-prep to seed and resolve QA users.';
  } else if (personas.length === 1 && personas[0].loginUrl) {
    authNote.textContent = 'Only user needed for this ticket — sign in once.';
  } else if (data.loginMode === 'manual' || personas.some(function (p) { return !p.loginUrl; })) {
    // loginNote (e.g. "follow the steps in .claude/qa/login.md") wins; else point at the form path.
    authNote.textContent = data.loginNote
      || ('No dev-login on this app — log in at ' + (data.appUrl || '') + (data.loginPath || '/login') + ' with the credentials above.');
  }
  renderCurrentPersona();

  // ---- env + seeded tables ---------------------------------------------
  var envBody = document.querySelector('#env-table tbody');
  (data.env || []).forEach(function (row) {
    var tr = document.createElement('tr');
    var icon = row.status === 'ok' ? '✅' : (row.status === 'bad' ? '❌' : '⚠️');
    var cls = row.status === 'ok' ? 'status-ok' : (row.status === 'bad' ? 'status-bad' : 'status-warn');
    tr.innerHTML = '<td class="' + cls + '">' + icon + '</td><td>' + esc(row.label) + '</td>'
      + '<td>' + esc(row.detail || '') + (row.remedy ? '<div class="remedy">→ ' + esc(row.remedy) + '</div>' : '') + '</td>';
    envBody.appendChild(tr);
  });
  if (!(data.env || []).length) envBody.innerHTML = '<tr><td colspan="3" class="empty-note">No environment checks recorded.</td></tr>';

  var seededBody = document.querySelector('#seeded-table tbody');
  (data.seeded || []).forEach(function (row) {
    var tr = document.createElement('tr');
    var where = row.link
      ? '<a href="' + esc(row.link) + '" target="_blank" rel="noopener">' + esc(row.whereToFind || row.link) + '</a>'
      : esc(row.whereToFind || '');
    tr.innerHTML = '<td><b>' + esc(row.label) + '</b></td><td>' + esc(row.what || '') + '</td><td>' + where + '</td>';
    seededBody.appendChild(tr);
  });
  if (!(data.seeded || []).length) seededBody.innerHTML = '<tr><td colspan="3" class="empty-note">No task-specific data was seeded — baseline LocalDataSeeder data only.</td></tr>';

  // ---- resource envelope (optional; scale-relevant changes only) --------
  // Absent key => nothing rendered, so guides for non-scale-relevant tickets are unchanged.
  var re = data.resourceEnvelope;
  if (re) {
    var reIcon = re.status === 'ok' ? '✅' : (re.status === 'fail' ? '❌' : '⚠️');
    var reCls = re.status === 'ok' ? 'status-ok' : (re.status === 'fail' ? 'status-bad' : 'status-warn');
    var reRows = (re.rows || []).map(function (row) {
      var i = row.status === 'ok' ? '✅' : (row.status === 'bad' ? '❌' : '⚠️');
      var c = row.status === 'ok' ? 'status-ok' : (row.status === 'bad' ? 'status-bad' : 'status-warn');
      return '<tr><td class="' + c + '">' + i + '</td><td>' + esc(row.label) + '</td><td>'
        + esc(row.value || '') + '</td></tr>';
    }).join('');
    document.getElementById('resource-envelope').innerHTML =
      '<h2>Resource envelope</h2>'
      + '<div class="card">'
      + '<p class="' + reCls + '" style="font-weight:600;margin:0 0 10px;">' + reIcon + ' '
      + esc(re.verdict || (re.status === 'not-measured' ? 'Not measured at production scale' : '')) + '</p>'
      + '<table><thead><tr><th></th><th>Measure</th><th>Value</th></tr></thead><tbody>'
      + (reRows || '<tr><td colspan="3" class="empty-note">No figures recorded.</td></tr>')
      + '</tbody></table>'
      + (re.basis === 'extrapolated'
          ? '<div class="remedy">→ Figures are extrapolated from a fraction of production scale, not measured at it.</div>'
          : '')
      + '</div>';
  }

  // ---- walkthrough video (agent-video, optional) -----------------------
  var wv = data.walkthroughVideo;
  if (wv && wv.src) {
    var vbox = document.getElementById('walkthrough-video');
    vbox.innerHTML = '<h2>' + esc(wv.label || 'Walkthrough video') + '</h2>'
      + '<div class="card"><video class="qa-video" controls preload="metadata" '
      + 'src="' + esc(wv.src) + '"' + (wv.poster ? ' poster="' + esc(wv.poster) + '"' : '') + '></video>'
      + '<div class="video-note">Recorded by agent-video (happy-path). '
      + '<a href="' + esc(wv.src) + '" target="_blank" rel="noopener">Open full size ↗</a></div></div>';
  }

  // ---- walkthrough ------------------------------------------------------
  var wrap = document.getElementById('walkthrough');
  var globalNum = 0;
  var sectionMeta = [];   // { countEl, ids } per section, for live per-section progress
  sections.forEach(function (section) {
    var dot = section.findings ? 'findings'
      : (/happy/i.test(section.title) ? 'happy' : (/edge/i.test(section.title) ? 'edge' : ''));
    var head = document.createElement('div');
    head.className = 'section-title';
    head.innerHTML = '<span class="sec-dot ' + dot + '"></span><h2>' + esc(section.title)
      + '</h2><span class="section-count"></span>';
    wrap.appendChild(head);
    var holder = document.createElement('div');
    if (section.findings) holder.className = 'findings';
    wrap.appendChild(holder);
    (section.steps || []).forEach(function (step) {
      globalNum += 1;
      holder.appendChild(renderStep(step, globalNum));
    });
    sectionMeta.push({ countEl: head.querySelector('.section-count'),
                       ids: (section.steps || []).map(function (s) { return s.id; }) });
  });
  if (!allSteps.length) {
    wrap.innerHTML = '<p class="empty-note">No walkthrough steps — this guide has no diff-anchored items.</p>';
  }

  function renderStep(step, num) {
    var el = document.createElement('div');
    el.className = 'step' + (step.severity === 'red' ? ' sev-red' : '');
    el.dataset.stepId = step.id;
    var cb = document.createElement('input');
    cb.type = 'checkbox';
    cb.checked = !!state.checks[step.id];
    if (cb.checked) el.classList.add('done');
    cb.addEventListener('change', function () {
      state.checks[step.id] = cb.checked;
      el.classList.toggle('done', cb.checked);
      save(); updateProgress();
    });
    var body = document.createElement('div');
    body.className = 'step-body';
    var html = '<div class="step-num">STEP ' + num + '</div>'
      + '<div class="action">' + esc(step.action) + '</div>';
    if (step.link) html += '<div class="deeplink">→ <a href="' + esc(step.link) + '" target="_blank" rel="noopener">' + esc(step.link) + '</a></div>';
    if (step.lookFor) html += '<div class="callout lookfor"><span class="clabel">👁 Look for</span>' + esc(step.lookFor) + '</div>';
    if (step.expected) html += '<div class="callout expected"><span class="clabel">✓ Expected</span>' + esc(step.expected) + '</div>';
    if (step.pitfall) html += '<div class="callout pitfall"><span class="clabel">⚠ Pitfall</span>' + esc(step.pitfall) + '</div>';
    // agent-qa visual evidence: a curated screenshot and/or a repro clip for this step.
    if (step.screenshot && step.screenshot.src) {
      html += '<a href="' + esc(step.screenshot.src) + '" target="_blank" rel="noopener">'
        + '<img class="step-shot" loading="lazy" src="' + esc(step.screenshot.src) + '"'
        + ' alt="' + esc(step.screenshot.caption || step.action) + '"></a>';
      if (step.screenshot.caption) html += '<div class="shot-cap">' + esc(step.screenshot.caption) + '</div>';
    }
    if (step.clip && step.clip.src) {
      html += '<video class="qa-video" controls preload="metadata" src="' + esc(step.clip.src) + '"></video>';
    }
    body.innerHTML = html;
    // Per-step one-click login for any step that requires a specific persona.
    if (step.persona) {
      var actionEl = body.querySelector('.action');
      var sl = makeStepLogin(step.persona);
      if (actionEl && actionEl.nextSibling) body.insertBefore(sl, actionEl.nextSibling);
      else body.appendChild(sl);
    }
    var ta = document.createElement('textarea');
    ta.placeholder = 'Notes for this step…';
    ta.value = state.notes[step.id] || '';
    ta.addEventListener('input', debounce(function () { state.notes[step.id] = ta.value; save(); }, 250));
    body.appendChild(ta);
    el.appendChild(cb); el.appendChild(body);
    return el;
  }

  // ---- footer -----------------------------------------------------------
  var generalNotes = document.getElementById('general-notes');
  generalNotes.value = state.generalNotes || '';
  generalNotes.addEventListener('input', debounce(function () { state.generalNotes = generalNotes.value; save(); }, 250));

  // "Hide completed" toggle — recede finished steps once the list gets long.
  var hideDoneEl = document.getElementById('hide-done');
  hideDoneEl.checked = !!state.hideDone;
  wrap.classList.toggle('hide-done', !!state.hideDone);
  hideDoneEl.addEventListener('change', function () {
    state.hideDone = hideDoneEl.checked;
    wrap.classList.toggle('hide-done', hideDoneEl.checked);
    save();
  });

  function updateProgress() {
    var done = allSteps.filter(function (s) { return state.checks[s.id]; }).length;
    var total = allSteps.length;
    document.getElementById('progress').textContent = done + '/' + total + ' verified';
    document.getElementById('auth-progress').innerHTML = '<b>' + done + '</b>/' + total + ' verified';
    document.getElementById('progress-bar').style.width = (total ? Math.round(done / total * 100) : 0) + '%';
    sectionMeta.forEach(function (sm) {
      if (!sm.countEl) return;
      var d = sm.ids.filter(function (id) { return state.checks[id]; }).length;
      sm.countEl.textContent = d + '/' + sm.ids.length;
    });
  }
  updateProgress();

  document.getElementById('export-btn').addEventListener('click', function () {
    var lines = ['# Human QA results — ' + ((t.key ? t.key + ' ' : '') + (t.summary || data.branch || '')).trim(), ''];
    var done = allSteps.filter(function (s) { return state.checks[s.id]; }).length;
    lines.push('**Progress:** ' + done + '/' + allSteps.length + ' verified · branch `' + (data.branch || '') + '`', '');
    if (state.currentPersona) lines.push('**Testing as:** ' + state.currentPersona, '');
    var n = 0;
    sections.forEach(function (section) {
      lines.push('## ' + section.title, '');
      (section.steps || []).forEach(function (step) {
        n += 1;
        lines.push('- [' + (state.checks[step.id] ? 'x' : ' ') + '] ' + n + '. ' + step.action);
        if (state.notes[step.id]) lines.push('  - note: ' + state.notes[step.id]);
      });
      lines.push('');
    });
    if (state.generalNotes) lines.push('## Overall notes', '', state.generalNotes, '');
    var md = lines.join('\n');
    navigator.clipboard.writeText(md).then(function () { confirmMsg('Copied to clipboard.'); },
      function () {
        var ta = document.createElement('textarea');
        ta.value = md; document.body.appendChild(ta); ta.select();
        document.execCommand('copy'); document.body.removeChild(ta);
        confirmMsg('Copied to clipboard.');
      });
  });

  document.getElementById('reset-btn').addEventListener('click', function () {
    if (!confirm('Clear all checkboxes and notes for ' + KEY + '?')) return;
    state = blankState(); save(); location.reload();
  });

  // ---- stale banner -----------------------------------------------------
  if (isStale) {
    var banner = document.getElementById('stale-banner');
    banner.style.display = 'block';
    document.getElementById('stale-keep').addEventListener('click', function () {
      save(); banner.style.display = 'none';
    });
    document.getElementById('stale-reset').addEventListener('click', function () {
      state = blankState(); save(); location.reload();
    });
  } else {
    save();
  }

  // ---- utils ------------------------------------------------------------
  function esc(s) {
    return String(s == null ? '' : s).replace(/[&<>"']/g, function (c) {
      return { '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c];
    });
  }
  function debounce(fn, ms) {
    var h; return function () { clearTimeout(h); var args = arguments, self = this;
      h = setTimeout(function () { fn.apply(self, args); }, ms); };
  }
  function confirmMsg(msg) {
    var el = document.getElementById('export-confirm');
    el.textContent = msg;
    setTimeout(function () { el.textContent = ''; }, 2500);
  }
  function makeStepLogin(persona) {
    if (persona.loginUrl) {
      var a = document.createElement('a');
      a.className = 'step-login';
      a.href = persona.loginUrl; a.target = '_blank'; a.rel = 'noopener';
      a.textContent = '↪ Sign in as ' + persona.label;
      a.addEventListener('click', function () { setCurrentPersona(persona.label); });
      return a;
    }
    var b = document.createElement('button');
    b.type = 'button'; b.className = 'step-login';
    b.textContent = '↪ Use ' + persona.label + (persona.credentials ? ' (copy login)' : '');
    b.addEventListener('click', function () {
      if (persona.credentials) copyText(persona.credentials, b);
      setCurrentPersona(persona.label);
    });
    return b;
  }
  function copyText(text, btn) {
    var done = function () {
      if (!btn) return;
      var orig = btn.textContent; btn.textContent = 'Copied';
      setTimeout(function () { btn.textContent = orig; }, 1500);
    };
    if (navigator.clipboard && navigator.clipboard.writeText) {
      navigator.clipboard.writeText(text).then(done, function () { fallbackCopy(text); done(); });
    } else { fallbackCopy(text); done(); }
  }
  function fallbackCopy(text) {
    var ta = document.createElement('textarea'); ta.value = text;
    document.body.appendChild(ta); ta.select();
    try { document.execCommand('copy'); } catch (e) {}
    document.body.removeChild(ta);
  }
})();
</script>
</body>
</html>
